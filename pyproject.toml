[project]
name = "llm-gateaway"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible gateway for multiple LLM providers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "anyio>=4.4.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires an external service such as PostgreSQL",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "S",
    "ASYNC",
    "C4",
    "DTZ",
    "PT",
    "RUF",
    "SIM",
    "T20",
]
ignore = [
    "S101", # asserts are the primary test assertion mechanism
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # test fixtures use obvious placeholder credentials
"alembic/**" = ["E501"]
# Local load-test tooling: prints are the operator output, subprocess arguments are
# fixed literals, and the stub uses random() for load shaping, not secrets.
"scripts/**" = ["T20", "S603", "S607", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
