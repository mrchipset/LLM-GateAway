name: llm-gateaway

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-gateaway-postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    ports:
      # Local development/debugging only. Remove this mapping behind a firewall.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: &default-logging
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: llm-gateaway-redis
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: llm-gateaway-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  backend:
    image: llm-gateaway-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    environment:
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-production}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      GATEWAY_STORAGE_BACKEND: postgres
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/0}
      GATEWAY_RATE_LIMIT_BACKEND: ${GATEWAY_RATE_LIMIT_BACKEND:-storage}
      GATEWAY_RATE_LIMIT_FAIL_OPEN: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:-true}
      GATEWAY_RATE_LIMIT_REDIS_TIMEOUT_SECONDS: ${GATEWAY_RATE_LIMIT_REDIS_TIMEOUT_SECONDS:-0.2}
      GATEWAY_OPENAI_API_KEY: ${GATEWAY_OPENAI_API_KEY:-}
      GATEWAY_OPENAI_BASE_URL: ${GATEWAY_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GATEWAY_DEEPSEEK_API_KEY: ${GATEWAY_DEEPSEEK_API_KEY:-}
      GATEWAY_DEEPSEEK_BASE_URL: ${GATEWAY_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      GATEWAY_FAKE_PROVIDER_ENABLED: ${GATEWAY_FAKE_PROVIDER_ENABLED:-false}
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-60}
      GATEWAY_CONNECT_TIMEOUT_SECONDS: ${GATEWAY_CONNECT_TIMEOUT_SECONDS:-10}
      GATEWAY_STREAM_IDLE_TIMEOUT_SECONDS: ${GATEWAY_STREAM_IDLE_TIMEOUT_SECONDS:-60}
      GATEWAY_SHUTDOWN_GRACE_SECONDS: ${GATEWAY_SHUTDOWN_GRACE_SECONDS:-30}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-1}
      GATEWAY_DATABASE_POOL_SIZE: ${GATEWAY_DATABASE_POOL_SIZE:-5}
      GATEWAY_DATABASE_MAX_OVERFLOW: ${GATEWAY_DATABASE_MAX_OVERFLOW:-5}
      GATEWAY_DATABASE_POOL_TIMEOUT_SECONDS: ${GATEWAY_DATABASE_POOL_TIMEOUT_SECONDS:-10}
      GATEWAY_DATABASE_STATEMENT_TIMEOUT_MS: ${GATEWAY_DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      GATEWAY_MAX_RETRIES: ${GATEWAY_MAX_RETRIES:-2}
      GATEWAY_AUDIT_ENABLED: ${GATEWAY_AUDIT_ENABLED:-false}
      GATEWAY_AUDIT_MAX_CONTENT_BYTES: ${GATEWAY_AUDIT_MAX_CONTENT_BYTES:-262144}
      GATEWAY_AUDIT_WRITE_TIMEOUT_SECONDS: ${GATEWAY_AUDIT_WRITE_TIMEOUT_SECONDS:-2}
      GATEWAY_TRACING_ENABLED: ${GATEWAY_TRACING_ENABLED:-false}
      GATEWAY_TRACING_ENDPOINT: ${GATEWAY_TRACING_ENDPOINT:-}
      GATEWAY_TRACING_SAMPLE_RATIO: ${GATEWAY_TRACING_SAMPLE_RATIO:-0.1}
      GATEWAY_TRACING_SERVICE_NAME: ${GATEWAY_TRACING_SERVICE_NAME:-llm-gateway}
      GATEWAY_TRACING_EXPORT_TIMEOUT_SECONDS: ${GATEWAY_TRACING_EXPORT_TIMEOUT_SECONDS:-5}
      GATEWAY_METRICS_ENABLED: ${GATEWAY_METRICS_ENABLED:-false}
      GATEWAY_METRICS_HOST: 0.0.0.0
      GATEWAY_METRICS_PORT: ${GATEWAY_METRICS_PORT:-9464}
      GATEWAY_METRICS_SERVICE_NAME: ${GATEWAY_METRICS_SERVICE_NAME:-llm-gateway}
      GATEWAY_BILLING_CURRENCY: ${GATEWAY_BILLING_CURRENCY:-USD}
      GATEWAY_MAX_REQUEST_BYTES: ${GATEWAY_MAX_REQUEST_BYTES:-1048576}
      GATEWAY_MAX_MESSAGES: ${GATEWAY_MAX_MESSAGES:-200}
      GATEWAY_MAX_PROMPT_CHARS: ${GATEWAY_MAX_PROMPT_CHARS:-1000000}
      GATEWAY_MAX_TOKENS_LIMIT: ${GATEWAY_MAX_TOKENS_LIMIT:-32768}
      GATEWAY_ROUTE_MAX_ATTEMPTS: ${GATEWAY_ROUTE_MAX_ATTEMPTS:-3}
      GATEWAY_ROUTE_FAILURE_THRESHOLD: ${GATEWAY_ROUTE_FAILURE_THRESHOLD:-3}
      GATEWAY_ROUTE_COOLDOWN_SECONDS: ${GATEWAY_ROUTE_COOLDOWN_SECONDS:-30}
      GATEWAY_MAX_TOOLS: ${GATEWAY_MAX_TOOLS:-128}
      GATEWAY_MASTER_KEY_ENABLED: ${GATEWAY_MASTER_KEY_ENABLED:-true}
      GATEWAY_SESSION_TTL_HOURS: ${GATEWAY_SESSION_TTL_HOURS:-12}
      GATEWAY_BOOTSTRAP_ADMIN_USERNAME: ${GATEWAY_BOOTSTRAP_ADMIN_USERNAME:-}
      GATEWAY_BOOTSTRAP_ADMIN_PASSWORD: ${GATEWAY_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      # Scrape port only, bound to loopback. The API stays behind the UI proxy.
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9464}:${GATEWAY_METRICS_PORT:-9464}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    # Give uvicorn time to drain in-flight streams before Docker sends SIGKILL.
    stop_grace_period: 45s
    logging: *default-logging

  ui:
    image: llm-gateaway-ui:local
    build:
      context: ./ui
      dockerfile: Dockerfile
    profiles: ["app"]
    ports:
      - "${GATEWAY_UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:

